name: Deploy TIDY HOME to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'tidy-home/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tidy-home/package-lock.json
      - run: npm ci
        working-directory: tidy-home
      - run: npm run build
        working-directory: tidy-home
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tidy-home/dist
      - id: deployment
        uses: actions/deploy-pages@v4
